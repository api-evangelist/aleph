name: Aleph
description: >-
  Aleph is an AI-native financial planning & analysis (FP&A) platform for finance
  teams that want live data, spreadsheet-native workflows, automated reporting, and
  AI-assisted analysis in one system. It consolidates data from ERP, HRIS, CRM,
  billing, and databases through 200+ no-code connectors, offers bi-directional
  Excel and Google Sheets add-ins, web dashboards, and an AI layer (Aleph
  Intelligence, Aleph Agent, AI Variance Analysis, AI Mappings). Aleph also ships
  an Aleph Agent MCP integration that brings governed financial data to Claude,
  ChatGPT, Cursor, and other MCP-compatible tools. Backed by Bain Capital Ventures;
  SOC 1 Type II and SOC 2 Type II certified.
